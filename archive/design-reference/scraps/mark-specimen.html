<!DOCTYPE html><html><head><meta charset="utf-8">
<script src="../kayan-mark.js"></script>
<style>
body{margin:0;background:#0B1C17;font:12px/1.4 ui-monospace,monospace;color:#8CA39C;padding:24px}
.row{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end;margin-bottom:34px}
.c{width:150px}
.l{margin:8px 0 0;letter-spacing:.12em;font-size:9px;color:#5E7A73}
.pale{background:#FAF6EC;padding:24px;margin:-24px -24px 24px}
.pale .l{color:#8A8272}
</style></head><body>
<div class="pale"><div class="row">
<div class="c"><kayan-mark line="gold" flock="1"></kayan-mark><p class="l">GOLD · 1</p></div>
<div class="c"><kayan-mark line="md" flock="1"></kayan-mark><p class="l">MD</p></div>
<div class="c"><kayan-mark line="rp" flock="1"></kayan-mark><p class="l">RP</p></div>
<div class="c"><kayan-mark line="hub" flock="1"></kayan-mark><p class="l">HUB</p></div>
<div class="c"><kayan-mark line="forge" flock="1"></kayan-mark><p class="l">FORGE</p></div>
<div class="c"><kayan-mark line="k4y" flock="1"></kayan-mark><p class="l">K4Y</p></div>
<div class="c"><kayan-mark line="ink" flock="1"></kayan-mark><p class="l">INK</p></div>
<div class="c"><kayan-mark line="gold" flat></kayan-mark><p class="l">GOLD FLAT</p></div>
</div></div>
<div class="row">
<div class="c" style="width:300px"><kayan-mark line="gold" flock="3" glow></kayan-mark><p class="l">FLOCK 3 + GLOW</p></div>
<div class="c" style="width:340px"><kayan-mark line="md" flock="5"></kayan-mark><p class="l">FLOCK 5</p></div>
<div class="c" style="width:360px"><kayan-mark line="forge" flock="7"></kayan-mark><p class="l">FLOCK 7</p></div>
<div class="c"><kayan-mark line="cream" facing="right"></kayan-mark><p class="l">CREAM MIRRORED</p></div>
</div>
<div class="row">
<div class="c" style="width:30px"><kayan-mark line="cream" flat></kayan-mark><p class="l">30PX</p></div>
<div class="c" style="width:18px"><kayan-mark line="cream" flat></kayan-mark><p class="l">18PX</p></div>
<div class="c" style="width:200px"><kayan-mark line="hub" flock="3" motion="glide" glow></kayan-mark><p class="l">GLIDE</p></div>
<div class="c" style="width:200px"><kayan-mark line="rp" flock="3" motion="soar"></kayan-mark><p class="l">SOAR</p></div>
</div>
</body></html>
