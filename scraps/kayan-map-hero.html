<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خريطة اليمن — كيان</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;500;600&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden;}
#wrap{position:absolute;inset:0;font-family:'IBM Plex Sans Arabic','Alexandria',sans-serif;}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
canvas.pt{cursor:pointer;}
#ov{position:absolute;inset:0;pointer-events:none;}
#ov span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;}
#st{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:11px/1.6 'IBM Plex Mono',monospace;letter-spacing:.18em;color:rgba(94,84,58,.5);}
.city{font-size:12px;color:#5E7A72;transition:color .25s ease,font-weight .25s ease;text-shadow:0 1px 6px rgba(253,251,244,.9);}
.city.on{color:#8F7218;font-weight:600;}
</style>
</head>
<body>
<div id="wrap">
  <div id="st">ADEN · 12.79N 45.03E</div>
</div>
<script>
(function () {
  var W = 1200, H = 760;
  var qs = new URLSearchParams(location.search);
  var lang = qs.get('lang') === 'en' ? 'en' : 'ar';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var LBL = {
    ar: { aden: 'عدن · المقر', sanaa: 'صنعاء', taiz: 'تعز', hadhramaut: 'شبام حضرموت', socotra: 'سقطرى', hawf: 'حوف', marib: 'مأرب', ldn: 'لندن', ruh: 'الرياض', nyc: 'نيويورك', src: 'حدود من بيانات Natural Earth العامة' },
    en: { aden: 'ADEN · HQ', sanaa: 'Sanaa', taiz: 'Taiz', hadhramaut: 'Shibam, Hadhramaut', socotra: 'Socotra', hawf: 'Hawf', marib: 'Marib', ldn: 'LONDON', ruh: 'RIYADH', nyc: 'NEW YORK', src: 'Boundaries from public Natural Earth data' }
  };
  var SCENES = [
    { k: 'sanaa', lon: 44.207, lat: 15.353, dx: 6, dy: -14 },
    { k: 'taiz', lon: 44.017, lat: 13.578, dx: -4, dy: 14 },
    { k: 'hadhramaut', lon: 48.6266, lat: 15.9269, dx: 8, dy: -14 },
    { k: 'socotra', lon: 53.905, lat: 12.510, dx: 0, dy: -15 },
    { k: 'hawf', lon: 52.8237, lat: 16.6519, dx: -6, dy: -14 },
    { k: 'marib', lon: 45.325, lat: 15.462, dx: 22, dy: 6 }
  ];
  var st = document.getElementById('st'), wrap = document.getElementById('wrap');
  function fail() { st.textContent = 'MAP OFFLINE · ADEN 12.79N 45.03E'; }

  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json').then(function (r) { return r.json(); }).then(function (topo) {
    var all = topojson.feature(topo, topo.objects.countries).features;
    var yemen = null;
    all.forEach(function (f) { if (f.properties.name === 'Yemen') yemen = f; });
    if (!yemen) return fail();
    var NB = ['Saudi Arabia', 'Oman', 'Djibouti', 'Eritrea', 'Somalia', 'Ethiopia'];
    var neighbors = all.filter(function (f) { return NB.indexOf(f.properties.name) >= 0; });
    var proj = d3.geoMercator().fitExtent([[74, 88], [W - 60, H - 62]], yemen);
    var path = d3.geoPath(proj);
    var yPath = new Path2D(path(yemen));
    var nbPath = new Path2D(neighbors.map(function (f) { return path(f); }).join(' '));
    var aden = proj([45.036, 12.786]);

    var mc = document.createElement('canvas'); mc.width = 4; mc.height = 4;
    var mctx = mc.getContext('2d');
    var nodes = SCENES.map(function (c) { var p = proj([c.lon, c.lat]); return { k: c.k, x: p[0], y: p[1], dx: c.dx, dy: c.dy }; });
    var hitNodes = nodes.concat([{ k: 'aden', x: aden[0], y: aden[1], dx: 10, dy: -22 }]);

    // dot field — hex grid inside the real polygon
    var dots = [], step = 10, row = 0, x, y;
    for (y = 58; y < H - 18; y += 8.66, row++) {
      for (x = 48 + (row % 2 ? step / 2 : 0); x < W - 26; x += step) {
        if (!mctx.isPointInPath(yPath, x, y)) continue;
        var a = 0.14 + Math.random() * 0.12, s = 1.15 + Math.random() * 0.7;
        for (var j = 0; j < hitNodes.length; j++) {
          var dc = Math.hypot(x - hitNodes[j].x, y - hitNodes[j].y);
          if (dc < 26) { a += 0.16 * (1 - dc / 26); s += 0.7 * (1 - dc / 26); }
        }
        var da = Math.hypot(x - aden[0], y - aden[1]);
        dots.push({ x: x, y: y, a: a, s: s, ph: Math.random() * 6.283, d: da, th: Math.atan2(-(y - aden[1]), x - aden[0]) });
      }
    }

    var ex1 = Math.max(96, aden[0] - 215), ex3 = Math.max(78, aden[0] - 335);
    var routes = [
      { k: 'ldn', ex: ex1, ey: 92 },
      { k: 'ruh', ex: aden[0] + 185, ey: 66 },
      { k: 'nyc', ex: ex3, ey: aden[1] - 168 }
    ];
    routes.forEach(function (r) {
      r.cx = (aden[0] + r.ex) / 2 + (r.ex - aden[0]) * 0.06;
      r.cy = Math.min(aden[1], r.ey) - 88;
    });

    st.remove();
    var cv = document.createElement('canvas');
    wrap.appendChild(cv);
    var ctx = cv.getContext('2d');
    var ov = document.createElement('div'); ov.id = 'ov';
    function mk(k, x, y, cls, css) {
      var sp = document.createElement('span');
      sp.setAttribute('data-t', k);
      if (cls) sp.className = cls;
      sp.style.left = (x / W * 100) + '%'; sp.style.top = (y / H * 100) + '%';
      if (css) sp.style.cssText += ';' + css;
      ov.appendChild(sp); return sp;
    }
    var cityEls = {};
    nodes.forEach(function (c) { cityEls[c.k] = mk(c.k, c.x + c.dx, c.y + c.dy, 'city', ''); });
    mk('aden', aden[0] + 10, aden[1] - 22, '', 'font-size:14.5px;font-weight:600;color:#8F7218;font-family:Alexandria,IBM Plex Sans Arabic,sans-serif;text-shadow:0 1px 8px rgba(253,251,244,.9);');
    var dest = {};
    routes.forEach(function (r) { dest[r.k] = mk(r.k, r.ex, r.ey - 15, '', 'font-size:12.5px;color:#8F7218;opacity:0;transition:opacity .4s ease;'); });
    mk('src', W - 12, H - 10, '', 'transform:translate(-100%,-100%);font-family:IBM Plex Mono,monospace;font-size:9px;letter-spacing:.08em;color:rgba(94,84,58,.42);');
    wrap.appendChild(ov);
    function relabel() {
      var L = LBL[lang];
      var ns = ov.querySelectorAll('[data-t]');
      for (var i = 0; i < ns.length; i++) { var k = ns[i].getAttribute('data-t'); if (L[k]) ns[i].textContent = L[k]; }
    }
    relabel();

    var sx = 1, sy = 1;
    function resize() {
      var r = wrap.getBoundingClientRect();
      if (r.width < 10) return;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      sx = cv.width / W; sy = cv.height / H;
      if (reduce) drawStatic();
    }
    new ResizeObserver(resize).observe(wrap);
    resize();

    var mx = -9999, my = -9999, tmx = -9999, tmy = -9999, hoverKey = null, activeKey = null;
    function toDesign(e) {
      var r = wrap.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
    }
    if (fine) {
      cv.addEventListener('pointermove', function (e) {
        var p = toDesign(e); tmx = p[0]; tmy = p[1];
        var hk = null;
        for (var i = 0; i < hitNodes.length; i++) {
          if (Math.hypot(p[0] - hitNodes[i].x, p[1] - hitNodes[i].y) < 20) { hk = hitNodes[i].k; break; }
        }
        if (hk !== hoverKey) {
          hoverKey = hk;
          cv.classList.toggle('pt', !!hk);
          for (var k in cityEls) cityEls[k].classList.toggle('on', k === hk);
        }
      });
      cv.addEventListener('pointerleave', function () { tmx = -9999; tmy = -9999; hoverKey = null; cv.classList.remove('pt'); for (var k in cityEls) cityEls[k].classList.remove('on'); });
    }
    cv.addEventListener('click', function (e) {
      var p = toDesign(e);
      for (var i = 0; i < hitNodes.length; i++) {
        if (Math.hypot(p[0] - hitNodes[i].x, p[1] - hitNodes[i].y) < 22) {
          activeKey = hitNodes[i].k;
          try { parent.postMessage({ kyn: 'scene', k: activeKey }, '*'); } catch (err) {}
          return;
        }
      }
    });
    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.kyn === 'lang' && (d.v === 'ar' || d.v === 'en')) { lang = d.v; relabel(); }
      if (d.kyn === 'focus' && typeof d.k === 'string') { activeKey = d.k; }
    });

    var BR = [143, 114, 24];   // bronze ink
    function frame(t) {
      ctx.setTransform(sx, 0, 0, sy, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(5,46,43,.10)'; ctx.lineWidth = 1;
      ctx.stroke(nbPath);
      ctx.fillStyle = 'rgba(201,162,39,.06)';
      ctx.fill(yPath);
      mx += (tmx - mx) * 0.14; my += (tmy - my) * 0.14;
      var sweep = 0.87 + 0.96 * Math.sin(t * 6.2832 / 13);
      for (var i = 0; i < dots.length; i++) {
        var d = dots[i];
        var intro = (t * 430 - d.d) / 320; if (intro <= 0) continue; if (intro > 1) intro = 1;
        intro = intro * intro * (3 - 2 * intro);
        var a = d.a * (0.82 + 0.18 * Math.sin(t * 0.7 + d.ph));
        var dth = d.th - sweep;
        if (dth > -0.16 && dth < 0.16) a += 0.3 * (1 - Math.abs(dth) / 0.16);
        var s = d.s;
        if (mx > -999) {
          var dx = d.x - mx, dy = d.y - my, dd = dx * dx + dy * dy;
          if (dd < 12100) { var kk = 1 - Math.sqrt(dd) / 110; a += 0.55 * kk * kk; s += 1.15 * kk; }
        }
        a *= intro; if (a > 0.95) a = 0.95;
        ctx.fillStyle = 'rgba(' + BR[0] + ',' + BR[1] + ',' + BR[2] + ',' + a.toFixed(3) + ')';
        ctx.fillRect(d.x - s / 2, d.y - s / 2, s, s);
      }
      // scene nodes
      for (var n = 0; n < nodes.length; n++) {
        var c = nodes[n], on = (hoverKey === c.k || activeKey === c.k);
        ctx.fillStyle = on ? '#8F7218' : 'rgba(14,110,102,.85)';
        ctx.beginPath(); ctx.arc(c.x, c.y, on ? 4.4 : 3.2, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = on ? 'rgba(143,114,24,.55)' : 'rgba(14,110,102,.35)';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(c.x, c.y, on ? 9.5 : 7, 0, 6.2832); ctx.stroke();
      }
      // one cycling route arc
      var P = 7, local = t % P, idx = Math.floor(t / P) % routes.length, r = routes[idx];
      var vis = Math.min(1, local / 0.5) * Math.max(0, Math.min(1, (P - 0.5 - local) / 0.9));
      var p1 = Math.min(1, local / 1.7); p1 = p1 * p1 * (3 - 2 * p1);
      if (vis > 0.01) {
        var L2 = Math.hypot(r.ex - aden[0], r.ey - aden[1]) * 1.15;
        ctx.strokeStyle = 'rgba(143,114,24,' + (0.5 * vis).toFixed(3) + ')';
        ctx.lineWidth = 1.4;
        ctx.setLineDash([L2]); ctx.lineDashOffset = L2 * (1 - p1);
        ctx.beginPath(); ctx.moveTo(aden[0], aden[1]);
        ctx.quadraticCurveTo(r.cx, r.cy, r.ex, r.ey); ctx.stroke();
        ctx.setLineDash([]);
        var q = Math.min(p1, (local * 0.5) % 1), mt = 1 - q;
        var qx = mt * mt * aden[0] + 2 * mt * q * r.cx + q * q * r.ex;
        var qy = mt * mt * aden[1] + 2 * mt * q * r.cy + q * q * r.ey;
        ctx.fillStyle = 'rgba(143,114,24,' + (0.95 * vis).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(qx, qy, 2.6, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = 'rgba(143,114,24,' + (0.7 * vis * p1).toFixed(3) + ')';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(r.ex, r.ey, 3.4, 0, 6.2832); ctx.stroke();
      }
      for (var dk in dest) dest[dk].style.opacity = (dk === r.k && p1 > 0.85) ? String(0.95 * vis) : '0';
      // Aden pulse — teal + gold
      var ph1 = (t * 0.357) % 1, ph2 = (t * 0.357 + 0.5) % 1;
      ctx.fillStyle = '#0E6E66';
      ctx.beginPath(); ctx.arc(aden[0], aden[1], 6.4, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#C9A227';
      ctx.beginPath(); ctx.arc(aden[0], aden[1], 3.1, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = 'rgba(14,110,102,' + (0.55 * (1 - ph1)).toFixed(3) + ')'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(aden[0], aden[1], 6 + ph1 * 27, 0, 6.2832); ctx.stroke();
      ctx.strokeStyle = 'rgba(201,162,39,' + (0.5 * (1 - ph2)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(aden[0], aden[1], 6 + ph2 * 27, 0, 6.2832); ctx.stroke();
    }
    function drawStatic() {
      ctx.setTransform(sx, 0, 0, sy, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(5,46,43,.10)'; ctx.lineWidth = 1; ctx.stroke(nbPath);
      ctx.fillStyle = 'rgba(201,162,39,.06)'; ctx.fill(yPath);
      for (var i = 0; i < dots.length; i++) {
        var d = dots[i];
        ctx.fillStyle = 'rgba(143,114,24,' + Math.min(0.9, d.a + 0.08).toFixed(3) + ')';
        ctx.fillRect(d.x - d.s / 2, d.y - d.s / 2, d.s, d.s);
      }
      for (var n = 0; n < nodes.length; n++) {
        var c = nodes[n];
        ctx.fillStyle = 'rgba(14,110,102,.85)';
        ctx.beginPath(); ctx.arc(c.x, c.y, 3.2, 0, 6.2832); ctx.fill();
      }
      routes.forEach(function (r) {
        ctx.strokeStyle = 'rgba(143,114,24,.32)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(aden[0], aden[1]); ctx.quadraticCurveTo(r.cx, r.cy, r.ex, r.ey); ctx.stroke();
        dest[r.k].style.opacity = '0.85';
      });
      ctx.fillStyle = '#0E6E66';
      ctx.beginPath(); ctx.arc(aden[0], aden[1], 6.4, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#C9A227';
      ctx.beginPath(); ctx.arc(aden[0], aden[1], 3.1, 0, 6.2832); ctx.fill();
    }
    if (reduce) { drawStatic(); return; }
    var t0 = performance.now();
    (function loop(now) {
      if (!document.hidden) frame((now - t0) / 1000);
      requestAnimationFrame(loop);
    })(t0);
  }).catch(fail);
})();
</script>
</body>
</html>
