<!doctype html><html><head><meta charset="utf-8">
<style>body{margin:0;background:#03201D;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
figure{margin:0;position:relative}
figcaption{position:absolute;left:4px;bottom:2px;font:10px ui-monospace,monospace;color:#EADFC0;opacity:.75}
img{display:block;width:100%;height:auto}
.pale{background:#FAF6EC}
</style>
<script src="../kayan-bird-filters.js"></script></head><body>
<figure><img src="../assets/bird-master.png" data-bird="gold"><figcaption>gold</figcaption></figure>
<figure><img src="../assets/bird-master.png" data-bird="md"><figcaption>md</figcaption></figure>
<figure><img src="../assets/bird-master.png" data-bird="rp"><figcaption>rp</figcaption></figure>
<figure><img src="../assets/bird-master.png" data-bird="hub"><figcaption>hub</figcaption></figure>
<figure><img src="../assets/bird-master.png" data-bird="forge"><figcaption>forge</figcaption></figure>
<figure><img src="../assets/bird-master.png" data-bird="k4y"><figcaption>k4y</figcaption></figure>
<figure class="pale"><img src="../assets/bird-master.png" data-bird="ivory"><figcaption style="color:#052E2B">ivory</figcaption></figure>
<figure><img src="../assets/bird-master.png"><figcaption>plate (no filter)</figcaption></figure>
</body></html>
