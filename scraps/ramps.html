<!doctype html><html><head><meta charset="utf-8">
<style>body{margin:0;background:#0A1512;color:#EADFC0;font:12px ui-monospace,monospace;padding:14px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.lbl{width:64px;text-align:right;opacity:.7}
.strip{flex:1;height:34px;background:linear-gradient(90deg,#000,#fff);border-radius:4px}
.small{width:70px;height:76px}
</style>
<script src="../kayan-bird-filters.js"></script></head><body>
<div class="row"><span class="lbl">raw</span><div class="strip"></div></div>
<div class="row"><span class="lbl">gold</span><div class="strip" style="filter:url(#kbGold)"></div></div>
<div class="row"><span class="lbl">md</span><div class="strip" style="filter:url(#kbMD)"></div></div>
<div class="row"><span class="lbl">rp</span><div class="strip" style="filter:url(#kbRP)"></div></div>
<div class="row"><span class="lbl">hub</span><div class="strip" style="filter:url(#kbHub)"></div></div>
<div class="row"><span class="lbl">forge</span><div class="strip" style="filter:url(#kbForge)"></div></div>
<div class="row"><span class="lbl">k4y</span><div class="strip" style="filter:url(#kbK4Y)"></div></div>
<div class="row"><span class="lbl">ivory</span><div class="strip" style="filter:url(#kbIvory)"></div></div>
<div class="row" style="margin-top:14px">
  <img class="small" src="../assets/kayan-mark-cream.png">
  <img class="small" src="../assets/kayan-mark-cream.png" style="filter:url(#kbGold)">
  <img class="small" src="../assets/kayan-mark-cream.png" style="filter:url(#kbRP)">
  <img class="small" src="../assets/kayan-mark-cream.png" style="filter:url(#kbForge)">

</body></html>
